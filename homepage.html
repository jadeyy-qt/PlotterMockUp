<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryForge — Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1420;
    --panel: #0f1f30;
    --panel-2: #142a3e;
    --panel-3: #1a3348;
    --border: #24435f;
    --border-soft: #1a3049;
    --text: #eef1e9;
    --text-dim: #a8bccf;
    --text-faint: #6d859f;
    --accent: #c9a24d;
    --accent-2: #e6c977;
    --gold: #c9a24d;
    --gold-bright: #e6c977;
    --maroon: #4a6d8c;
    --maroon-deep: #1c3348;
    --sci: #4a86c9;
    --hist: #c9a24d;
    --math: #6f8fc9;
    --lit: #a9364a;
    --lang: #c9636f;
    --soc: #4ade9a;
    --arts: #c9a24d;
    --health: #4ade9a;
    --radius-lg: 18px;
    --radius-md: 12px;
    --font-display: 'Fraunces', serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(74,109,140,.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(201,162,77,.06), transparent 55%),
      radial-gradient(ellipse 1000px 600px at 50% 100%, rgba(20,50,80,.35), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  ::selection{ background: rgba(201,162,77,.35); color:#fff; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: #1e3c56; border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background: var(--maroon); }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- Layout shell ---------- */
  .shell{
    display:grid;
    grid-template-columns: 84px 1fr 300px;
    min-height:100vh;
  }
  @media (max-width: 1180px){
    .shell{ grid-template-columns: 84px 1fr; }
    .right-rail{ display:none; }
  }
  @media (max-width: 720px){
    .shell{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
  }

  /* ---------- Left sidebar ---------- */
  .sidebar{
    background: var(--panel);
    border-right: 1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 0 16px;
    position:sticky; top:0; height:100vh;
  }
  .logo{
    width:38px; height:38px; border-radius:11px;
    background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    border: 1px solid rgba(212,175,106,.5);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
    box-shadow: 0 4px 14px rgba(20,40,58,.55), 0 0 0 1px rgba(212,175,106,.15);
  }
  .logo svg path{ fill: var(--gold) !important; }
  .logo svg{ width:20px; height:20px; }

  .create-btn{
    width:44px; height:44px; border-radius:13px;
    background: var(--panel-2);
    border:1px solid var(--border);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:600;
    margin-bottom: 26px;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .create-btn:hover{ background:#1c3a52; border-color: var(--accent); transform: translateY(-1px); }

  .nav{
    display:flex; flex-direction:column; gap:4px;
    width:100%;
    align-items:center;
    flex:1;
  }
  .nav-item{
    width:64px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding: 9px 0 7px;
    border-radius: 12px;
    color: var(--text-faint);
    font-size:11px; font-weight:500;
    transition: color .15s ease, background .15s ease;
    position:relative;
    background:none; border:none;
  }
  .nav-item svg{ width:19px; height:19px; }
  .nav-item:hover{ color: var(--text-dim); }
  .nav-item.active{
    color: var(--gold-bright);
    background: rgba(212,175,106,.12);
  }
  .nav-item.active::before{
    content:"";
    position:absolute; left:-1px; top:50%; transform:translateY(-50%);
    width:3px; height:20px; border-radius:3px;
    background: var(--gold);
  }


  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
    padding: 18px 28px;
    background: rgba(13,14,20,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(212,175,106,.15);
  }
  .search{
    flex:1; max-width: 480px;
    display:flex; align-items:center; gap:10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
    color: var(--text-faint);
    transition: border-color .15s ease, background .15s ease;
  }
  .search:hover{ border-color: var(--gold); box-shadow: 0 0 0 1px rgba(212,175,106,.12); }
  .search svg{ width:16px; height:16px; flex-shrink:0; }
  .search input{
    background:none; border:none; outline:none; color:var(--text);
    font-size: 14px; width:100%;
    font-family:inherit;
  }
  .search input::placeholder{ color: var(--text-faint); }

  .topbar-icons{ display:flex; align-items:center; gap:16px; margin-left:auto; }
  .bell{
    position:relative;
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
    transition: background .15s ease;
    background:none; border:none;
  }
  .bell:hover{ background: var(--panel-2); color: var(--gold); }
  .bell svg{ width:19px; height:19px; }
  .bell-dot{
    position:absolute; top:6px; right:6px;
    width:8px; height:8px; border-radius:50%;
    background: var(--lit); border:2px solid var(--bg);
    display:none;
  }
  .bell.has-unread .bell-dot{ display:block; }

  /* ---------- Main column ---------- */
  main{ padding: 6px 28px 60px; min-width:0; }

  .section-label{
    position:relative;
    display:inline-flex; align-items:center; gap:9px;
    font-family: var(--font-display);
    font-size: 14px; font-weight:600; letter-spacing: .08em;
    color: var(--gold-bright);
    text-transform: uppercase;
    margin: 22px 0 20px;
    padding: 10px 26px 10px 20px;
    background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    border: 1px solid rgba(230,201,119,.55);
    border-radius: 3px;
    clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - 14px) 100%, 0 100%);
    box-shadow: 0 8px 20px rgba(0,0,0,.4);
  }
  .section-label svg{ width:13px; height:13px; fill: var(--gold); }

  /* staff picks */
  .staff-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:18px;
    margin-bottom: 8px;
  }
  @media (max-width: 900px){ .staff-row{ grid-template-columns: 1fr; } }

  .staff-card{
    position:relative;
    border-radius: var(--radius-lg);
    padding: 18px;
    min-height: 220px;
    display:flex; flex-direction:column;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,.06);
    transition: transform .2s ease, box-shadow .2s ease;
    background-size: cover;
    background-position: center;
  }
  .staff-card:hover{ transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,.4); }
  .staff-card::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  .staff-card > *{ position:relative; z-index:1; }

  .badge{
    display:inline-flex; align-items:center;
    font-size: 10px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase;
    padding: 4px 10px; border-radius: 4px;
    width: fit-content;
    backdrop-filter: blur(4px);
    font-family: var(--font-display);
  }

  .staff-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .author{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#fff; }
  .author-dot{
    width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff;
    flex-shrink:0;
  }
  .scene-count{ font-size:12px; color: rgba(255,255,255,.75); font-weight:500; }

  .staff-card .card-title{
    font-family: var(--font-display);
    font-size: 21px; font-weight:600; color:#fff;
    margin-top:auto; margin-bottom:6px;
    line-height:1.2;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .staff-card .card-desc{ font-size:13px; color: rgba(255,255,255,.85); line-height:1.4; max-width: 92%; text-shadow: 0 1px 6px rgba(0,0,0,.6); }

  /* filter pills */
  .filters{
    display:flex; align-items:center; gap:9px;
    flex-wrap:wrap;
    margin: 26px 0 20px;
  }
  .pill{
    display:flex; align-items:center; gap:7px;
    padding: 8px 15px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px; font-weight:600;
    transition: all .15s ease;
  }
  .pill:hover{ border-color: var(--gold); color:var(--gold-bright); }
  .pill .dot{ width:7px; height:7px; border-radius:50%; }
  .pill.active{
    background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .pill.active .dot{ background: var(--gold-bright) !important; }

  .grid-meta{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .grid-meta .count{ font-size:14px; color: var(--text-dim); font-weight:500; }
  .sort{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--gold); font-weight:500;
  }
  .sort svg{ width:14px; height:14px; }

  /* template grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width: 900px){ .grid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 600px){ .grid{ grid-template-columns: 1fr; } }

  .tpl-card{
    border-radius: var(--radius-lg);
    background: var(--panel);
    border: 1px solid var(--border-soft);
    overflow:hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column;
  }
  .tpl-card:hover{
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 16px 34px rgba(0,0,0,.38), 0 0 0 1px rgba(212,175,106,.15);
  }
  .tpl-thumb{
    position:relative;
    height: 148px;
    padding: 14px;
    display:flex; flex-direction:column; justify-content:space-between;
    background-size: cover;
    background-position: center;
  }
  .tpl-thumb::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.45) 100%);
  }
  .tpl-thumb > *{ position:relative; z-index:1; }
  .tpl-thumb .badge{ align-self:flex-start; }
  .tpl-thumb .scene-count{
    align-self:flex-end;
    background: rgba(0,0,0,.35);
    padding: 3px 9px; border-radius:999px;
    backdrop-filter: blur(3px);
  }
  .tpl-actions{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: rgba(8,8,14,.55);
    opacity:0; transition: opacity .18s ease;
    z-index:2;
  }
  .tpl-card:hover .tpl-actions{ opacity:1; }
  .btn-use{
    background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color:#2a1608; border:none;
    padding: 9px 16px; border-radius: 999px;
    font-size:13px; font-weight:700;
    transition: filter .15s ease;
  }
  .btn-use:hover{ filter: brightness(1.08); }
  .btn-preview{
    background: rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.3);
    padding: 9px 16px; border-radius: 999px;
    font-size:13px; font-weight:700;
    backdrop-filter: blur(4px);
  }
  .btn-preview:hover{ background: rgba(255,255,255,.18); }

  .tpl-body{ padding: 14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .tpl-body .card-title{ font-size:15.5px; font-weight:700; color:var(--text); line-height:1.3; }
  .tpl-body .card-desc{ font-size:12.5px; color: var(--text-faint); line-height:1.45; flex:1; }
  .tpl-author{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .tpl-author .author-dot{ width:20px; height:20px; font-size:10px; }
  .tpl-author span{ font-size:12.5px; color: var(--text-dim); font-weight:500; }

  .empty-state{
    grid-column: 1 / -1;
    text-align:center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-size:14px;
  }

  /* ---------- Right rail ---------- */
  .right-rail{
    border-left: 1px solid var(--border-soft);
    padding: 20px 22px 40px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rr-label{
    font-size:11px; font-weight:700; letter-spacing:.09em;
    color: var(--text-faint); text-transform:uppercase;
    margin: 20px 0 12px;
    display:flex; align-items:center; gap:6px;
  }
  .rr-label::after{ content:""; flex:1; height:1px; background: linear-gradient(90deg, var(--border), transparent); }
  .rr-label:first-child{ margin-top:4px; }

  .btn-primary{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: linear-gradient(135deg, var(--gold), #b88a45);
    color:#2a1608; border: 1px solid rgba(230,201,119,.6);
    padding: 13px; border-radius: 12px;
    font-size:14.5px; font-weight:700;
    box-shadow: 0 8px 20px rgba(201,162,77,.22);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 10px 24px rgba(212,175,106,.34); }
  .btn-primary svg{ width:16px; height:16px; }

  .btn-outline{
    width:100%; margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 12px; border-radius: 12px;
    font-size:14px; font-weight:600;
    transition: all .15s ease;
  }
  .btn-outline:hover{ border-color: var(--accent); color:var(--text); background: var(--panel-2); }

  .qa-item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 4px;
    font-size:13.5px; color: var(--text-dim); font-weight:500;
    border-radius: 9px;
    transition: color .15s ease, background .15s ease;
  }
  .qa-item:hover{ color:var(--gold-bright); background: var(--panel-2); padding-left:10px; }
  .qa-item svg{ width:16px; height:16px; flex-shrink:0; color: var(--text-faint); }

  .genre-item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 4px;
    font-size:13.5px; font-weight:500; color: var(--text-dim);
    border-radius: 9px;
    transition: background .15s ease, color .15s ease;
  }
  .genre-item:hover{ background: var(--panel-2); color:var(--text); padding-left:10px; }
  .genre-item.active{ color: var(--gold-bright); }
  .genre-left{ display:flex; align-items:center; gap:9px; }
  .g-dot{ width:8px; height:8px; border-radius:50%; }
  .genre-item .n{ color: var(--text-faint); font-size:12.5px; }

  .story-item{
    display:flex; align-items:center; gap:11px;
    padding: 8px 4px;
    border-radius: 10px;
    transition: background .15s ease;
  }
  .story-item:hover{ background: var(--panel-2); }
  .story-thumb{
    width:36px; height:36px; border-radius:9px; flex-shrink:0;
    border: 1px solid rgba(212,175,106,.35);
    background-size: cover;
    background-position: center;
  }
  .story-item .t{ font-size:13.5px; font-weight:600; color:var(--text); line-height:1.25; }
  .story-item .ts{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }

  .view-all{
    font-size:13px; font-weight:600; color: var(--gold);
    margin-top:10px; display:inline-block;
  }

  .help-fab{
    position:fixed; bottom:22px; right:22px;
    width:38px; height:38px; border-radius:50%;
    background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    border:1px solid rgba(212,175,106,.5);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold-bright); font-weight:700; font-size:14px;
    z-index:30;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
  }

  /* ================= Notifications dropdown ================= */
  .notif-pop{
    position:absolute; top:66px; right:28px;
    width:340px; max-height:420px; overflow-y:auto;
    background: var(--panel); border:1px solid rgba(212,175,106,.25);
    border-radius: var(--radius-md);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    z-index:60;
    display:none;
  }
  .notif-pop.open{ display:block; }
  .notif-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--border-soft);
    font-size:13.5px; font-weight:700;
  }
  .notif-head .clear{ font-size:12px; font-weight:600; color:var(--gold); background:none; border:none; }
  .notif-item{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 16px; border-bottom:1px solid var(--border-soft);
  }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item .ic{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(212,175,106,.15); color:var(--gold); font-size:14px;
  }
  .notif-item .txt{ font-size:13px; color:var(--text-dim); line-height:1.4; }
  .notif-item.unread .txt{ color:var(--text); }
  .notif-item .when{ font-size:11px; color:var(--text-faint); margin-top:3px; }
  .notif-empty{ padding:36px 16px; text-align:center; color:var(--text-faint); font-size:13px; }

</style>
</head>
<body>

<div class="shell">

  <!-- ================= LEFT SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z" fill="white" opacity=".9"/><path d="M13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13V4Z" fill="white" opacity=".55"/></svg>
    </div>
    <button class="create-btn" title="Create">+</button>
    <nav class="nav">
      <a class="nav-item active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>Home</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Templates</a>
      <a class="nav-item" href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>Projects</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Characters</a>
      <a class="nav-item" href="scenes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="12" rx="1.5"/><path d="M20 8l-4 2.5v3L20 16V8Z"/></svg>Scenes</a>

    </nav>
  </aside>

  <!-- ================= MAIN ================= -->
  <div>
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchInput" type="text" placeholder="Search templates or artists…">
      </div>

  { title:"Sound & Story", desc:"Learn music theory fundamentals through an interactive band-practice narrative.", author:"Devin Okafor", scenes:7, cat:'arts' },

  { title:"Mind Matters", desc:"A compassionate story that builds mental health literacy and coping strategies.", author:"Dr. Riya Sen", scenes:12, cat:'health' },
  { title:"The Nutrition Lab", desc:"Students run a school cafeteria and learn about balanced nutrition through choices.", author:"Carlos Mendes", scenes:8, cat:'health' },
];

const stories = [
  { title:"The Scientific Method", ts:"2h ago", grad: GRADIENTS[6] },
  { title:"Ancient Rome: Rise & Fall", ts:"Yesterday", grad: GRADIENTS[3] },
  { title:"Algebra Adventures", ts:"3 days ago", grad: GRADIENTS[8] },
];

/* ---------------- Render ---------------- */
function catMeta(key){ return CATS.find(c=>c.key===key); }

function bgFor(title, idx, multiplier){
  const uri = svgUri(title);
  if(uri) return `background-image:url('${uri}');`;
  const grad = GRADIENTS[(idx*(multiplier||1)) % GRADIENTS.length];
  return `background:${grad};`;
}

function staffCard(t, idx){
  const meta = catMeta(t.cat);
  return `
  <div class="staff-card" style="${bgFor(t.title, idx, 1)}">
    <div class="staff-top">
      <span class="badge" style="background:${meta.color}22; color:${meta.color}; border:1px solid ${meta.color}55">${meta.label}</span>
    </div>
    <div class="staff-top" style="margin-bottom:0; margin-top:-6px;">
      <div class="author">
        <span class="author-dot" style="background:${colorFor(t.author)}">${initials(t.author)}</span>
        ${t.author}
      </div>
      <span class="scene-count">${t.scenes} scenes</span>
    </div>
    <div class="card-title">${t.title}</div>
    <div class="card-desc">${t.desc}</div>
  </div>`;
}

function tplCard(t, idx){
  const meta = catMeta(t.cat);
  return `
  <div class="tpl-card" data-cat="${t.cat}" data-title="${t.title.toLowerCase()}" data-author="${t.author.toLowerCase()}">
    <div class="tpl-thumb" style="${bgFor(t.title, idx, 3)}">
      <span class="badge" style="background:${meta.color}25; color:${meta.color}; border:1px solid ${meta.color}55">${meta.label}</span>
      <span class="scene-count">${t.scenes} scenes</span>
      <div class="tpl-actions">
        <button class="btn-use">Use template</button>
        <button class="btn-preview">Preview</button>
      </div>
    </div>
    <div class="tpl-body">
      <div class="card-title">${t.title}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="tpl-author">
        <span class="author-dot" style="background:${colorFor(t.author)}">${initials(t.author)}</span>
        <span>${t.author}</span>
      </div>
    </div>
  </div>`;
}

function renderStaff(){
  const picks = templates.filter(t=>t.staff);
  document.getElementById('staffRow').innerHTML = picks.map((t,i)=>staffCard(t,i)).join('');
}

function renderFilters(){
  document.getElementById('filters').innerHTML = CATS.map(c => `
    <button class="pill ${c.key==='all' ? 'active':''}" data-cat="${c.key}">
      ${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}
      ${c.label}
    </button>`).join('');

  document.querySelectorAll('.pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      filterGrid(p.dataset.cat, document.getElementById('searchInput').value);
    });
  });
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty-state">No templates match your search. Try a different keyword or genre.</div>`;
  } else {
    grid.innerHTML = list.map((t,i)=>tplCard(t,i)).join('');
  }
  document.getElementById('gridCount').textContent = `${list.length} template${list.length===1?'':'s'}`;
}

function filterGrid(cat, query){
  const q = (query||'').trim().toLowerCase();
  const filtered = templates.filter(t=>{
    const matchesCat = cat==='all' || t.cat===cat;
    const matchesQuery = !q || t.title.toLowerCase().includes(q) || t.author.toLowerCase().includes(q);
    return matchesCat && matchesQuery;
  });
  renderGrid(filtered);
}

function renderGenres(){
  const counts = {};
  templates.forEach(t => counts[t.cat] = (counts[t.cat]||0) + 1);
  const list = CATS.filter(c=>c.key!=='all');
  document.getElementById('genreList').innerHTML = list.map(c => `
    <div class="genre-item" data-cat="${c.key}">
      <span class="genre-left"><span class="g-dot" style="background:${c.color}"></span>${c.label}</span>
      <span class="n">${counts[c.key]||0}</span>
    </div>`).join('');

  document.querySelectorAll('.genre-item').forEach(g=>{
    g.addEventListener('click', ()=>{
      const cat = g.dataset.cat;
      document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.cat===cat));
      filterGrid(cat, document.getElementById('searchInput').value);
      document.querySelector('main').scrollIntoView({behavior:'smooth'});
    });
  });
}

function renderStories(){
  document.getElementById('storyList').innerHTML = stories.map(s => `
    <div class="story-item">
      <div class="story-thumb" style="background:${s.grad}"></div>
      <div>
        <div class="t">${s.title}</div>
        <div class="ts">${s.ts}</div>
      </div>
    </div>`).join('');
}

/* ---------------- Init ---------------- */
renderStaff();
renderFilters();
renderGrid(templates);
renderGenres();
renderStories();

document.getElementById('searchInput').addEventListener('input', (e)=>{
  const activeCat = document.querySelector('.pill.active')?.dataset.cat || 'all';
  filterGrid(activeCat, e.target.value);
});

/* ---------------- Notifications (lightweight, homepage) ---------------- */
let notifications = [
  { id:'n1', text:'Elena Cruz accepted your invite to "Ancient Rome: Rise & Fall."', when:'Yesterday', read:false },
];

const notifBell = document.getElementById('notifBell');
const notifPop = document.getElementById('notifPop');
const notifList = document.getElementById('notifList');

function renderNotifications(){
  const hasUnread = notifications.some(n=>!n.read);
  notifBell.classList.toggle('has-unread', hasUnread);

  notifList.innerHTML = notifications.length
    ? notifications.map(n => `
      <div class="notif-item ${n.read?'':'unread'}">
        <div class="ic">🔔</div>
        <div>
          <div class="txt">${n.text}</div>
          <div class="when">${n.when}</div>
        </div>
      </div>`).join('')
    : `<div class="notif-empty">You're all caught up — no notifications yet.</div>`;
}

notifBell.addEventListener('click', (e)=>{
  e.stopPropagation();
  notifPop.classList.toggle('open');
  if(notifPop.classList.contains('open')){
    notifications.forEach(n=>n.read=true);
    renderNotifications();
  }
});
document.addEventListener('click', (e)=>{
  if(!notifPop.contains(e.target) && e.target!==notifBell) notifPop.classList.remove('open');
});
document.getElementById('notifClear').addEventListener('click', ()=>{
  notifications.forEach(n=>n.read=true);
  renderNotifications();
});

renderNotifications();
</script>
</body>
</html>
