<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plotter — Templates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <style>
        /* ---------- reset / base ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
        }
        body {
            background: #0a1420;
            color: #eef1e9;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        ::selection {
            background: rgba(201, 162, 77, .35);
            color: #fff;
        }
        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e3c56;
            border-radius: 8px;
            border: 2px solid #0a1420;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a6d8c;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* ---------- page layout ---------- */
        .app {
            display: flex;
            min-height: 100vh;
            padding: 20px 24px 24px 24px;
            gap: 24px;
            position: relative;
        }

        /* ---------- SIDEBAR ---------- */
        #sidebar-container {
            flex-shrink: 0;
            z-index: 50;
        }
        .sidebar {
            width: 76px;
            background: #0f1f30;
            border: 1px solid rgba(212, 175, 106, .20);
            border-radius: 20px;
            padding: 18px 0 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .55);
            backdrop-filter: blur(4px);
            height: calc(100vh - 48px);
            min-height: 460px;
            position: sticky;
            top: 20px;
            transition: transform .25s ease, opacity .25s ease;
        }

        /* ---- LOGO – NO FRAME ---- */
        .sidebar-logo {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            margin-bottom: 18px;
            flex-shrink: 0;
        }
        .sidebar-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .sidebar-logo .logo-placeholder {
            font-size: 18px;
            font-weight: 700;
            color: #c9a24d;
            letter-spacing: -.5px;
        }

        .sidebar-create {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #142a3e;
            border: 1px solid #24435f;
            color: #c9a24d;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            transition: background .15s ease, border-color .15s ease, transform .15s ease;
            flex-shrink: 0;
            position: relative;
        }
        .sidebar-create:hover {
            background: #1c3a52;
            border-color: #c9a24d;
            transform: translateY(-1px);
        }

        /* ---- create dropdown menu (Upload / Create blank project) ----
           !important used because sidebar.html may load its own .create-menu
           rules after this stylesheet and win the cascade otherwise. */
        .create-menu {
            display: none;
            position: absolute !important;
            top: 0 !important;
            left: calc(100% + 10px) !important;
            width: 210px !important;
            background: #0f1f30 !important;
            border: 1px solid rgba(212, 175, 106, .25) !important;
            border-radius: 12px !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .5) !important;
            padding: 6px !important;
            z-index: 90 !important;
        }
        .create-menu.open {
            display: block;
        }
        .create-menu-item {
            display: block !important;
            width: 100% !important;
            text-align: left !important;
            padding: 10px 12px !important;
            border-radius: 8px !important;
            font-size: 13.5px !important;
            font-weight: 600 !important;
            color: #a8bccf !important;
            background: none !important;
            border: none !important;
        }
        .create-menu-item:hover {
            background: #142a3e !important;
            color: #e6c977 !important;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            align-items: center;
            flex: 1;
            padding: 0 4px;
        }
        .sidebar-nav .nav-item {
            width: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 0 6px;
            border-radius: 12px;
            color: #6d859f;
            font-size: 10px;
            font-weight: 500;
            transition: color .15s ease, background .15s ease;
            position: relative;
            border: none;
            background: none;
            text-align: center;
        }
        .sidebar-nav .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item:hover {
            color: #a8bccf;
        }
        .sidebar-nav .nav-item.active {
            color: #e6c977;
            background: rgba(212, 175, 106, .10);
        }
        .sidebar-nav .nav-item.active::before {
            content: "";
            position: absolute;
            left: -2px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            border-radius: 3px;
            background: #c9a24d;
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: auto;
            padding-top: 12px;
            width: 100%;
            border-top: 1px solid rgba(36, 67, 95, .45);
        }
        .sidebar-bottom .bell-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6d859f;
            transition: color .15s ease, background .15s ease;
            background: none;
            border: none;
        }
        .sidebar-bottom .bell-btn:hover {
            color: #e6c977;
            background: rgba(212, 175, 106, .08);
        }
        .sidebar-bottom .bell-btn svg {
            width: 18px;
            height: 18px;
        }
        .sidebar-bottom .bell-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a9364a;
            border: 2px solid #0f1f30;
            display: none;
        }
        .sidebar-bottom .bell-btn.has-unread .bell-dot {
            display: block;
        }

        .sidebar-bottom .help-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6d859f;
            font-weight: 700;
            font-size: 16px;
            transition: color .15s ease, background .15s ease;
            background: none;
            border: none;
        }
        .sidebar-bottom .help-btn:hover {
            color: #e6c977;
            background: rgba(212, 175, 106, .08);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding-top: 8px;
        }

        /* --- HERO: brand + search side by side --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 6px 0 24px 0;
            flex-wrap: wrap;
        }
        .hero-brand {
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }
        .brand-img {
            max-height: 34px;
            width: auto;
            display: block;
        }
        .brand-text {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 600;
            color: #e6c977;
            letter-spacing: -.02em;
            text-shadow: 0 2px 12px rgba(201, 162, 77, .12);
            line-height: 1.2;
        }
        .hero-search {
            flex: 1;
            min-width: 200px;
            max-width: 520px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #142a3e;
            border: 1px solid #24435f;
            border-radius: 14px;
            padding: 10px 18px;
            color: #6d859f;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .hero-search:hover {
            border-color: #c9a24d;
            box-shadow: 0 0 0 1px rgba(212, 175, 106, .12);
        }
        .hero-search svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .hero-search input {
            background: none;
            border: none;
            outline: none;
            color: #eef1e9;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
        }
        .hero-search input::placeholder {
            color: #6d859f;
        }

        .content-area {
            flex: 1;
            padding-bottom: 40px;
        }

        .filters {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            margin: 10px 0 18px;
        }
        .pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 15px;
            border-radius: 999px;
            background: #0f1f30;
            border: 1px solid #1a3049;
            color: #a8bccf;
            font-size: 13px;
            font-weight: 600;
            transition: all .15s ease;
        }
        .pill:hover {
            border-color: #c9a24d;
            color: #e6c977;
        }
        .pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .pill.active {
            background: linear-gradient(135deg, #1c3348, #0f1f30);
            border-color: #c9a24d;
            color: #e6c977;
        }
        .pill.active .dot {
            background: #e6c977 !important;
        }

        .grid-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .grid-meta .count {
            font-size: 14px;
            color: #a8bccf;
            font-weight: 500;
        }
        .grid-meta .sort {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #c9a24d;
            font-weight: 500;
        }
        .grid-meta .sort svg {
            width: 14px;
            height: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .tpl-card {
            border-radius: 16px;
            background: #0f1f30;
            border: 1px solid #1a3049;
            overflow: hidden;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
            display: flex;
            flex-direction: column;
        }
        .tpl-card:hover {
            transform: translateY(-3px);
            border-color: #c9a24d;
            box-shadow: 0 16px 34px rgba(0, 0, 0, .38), 0 0 0 1px rgba(212, 175, 106, .10);
        }

        .tpl-thumb {
            position: relative;
            height: 148px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-size: cover;
            background-position: center;
            background-color: #142a3e;
        }
        .tpl-thumb::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .05) 0%, rgba(0, 0, 0, .45) 100%);
        }
        .tpl-thumb>* {
            position: relative;
            z-index: 1;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            width: fit-content;
            backdrop-filter: blur(4px);
            font-family: 'Fraunces', serif;
        }
        .tpl-thumb .scene-count {
            align-self: flex-end;
            background: rgba(0, 0, 0, .35);
            padding: 3px 9px;
            border-radius: 999px;
            backdrop-filter: blur(3px);
            font-size: 12px;
            color: rgba(255, 255, 255, .75);
            font-weight: 500;
        }

        .tpl-actions {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(8, 8, 14, .55);
            opacity: 0;
            transition: opacity .18s ease;
            z-index: 2;
        }
        .tpl-card:hover .tpl-actions {
            opacity: 1;
        }
        .btn-use {
            background: linear-gradient(135deg, #c9a24d, #e6c977);
            color: #2a1608;
            border: none;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            transition: filter .15s ease;
        }
        .btn-use:hover {
            filter: brightness(1.08);
        }
        .btn-preview {
            background: rgba(255, 255, 255, .10);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .25);
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }
        .btn-preview:hover {
            background: rgba(255, 255, 255, .18);
        }

        .tpl-body {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .tpl-body .card-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #eef1e9;
            line-height: 1.3;
        }
        .tpl-body .card-desc {
            font-size: 12.5px;
            color: #6d859f;
            line-height: 1.45;
            flex: 1;
        }
        .tpl-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .tpl-author .author-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .tpl-author span {
            font-size: 12.5px;
            color: #a8bccf;
            font-weight: 500;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #6d859f;
            font-size: 14px;
        }

        /* ---------- RIGHT RAIL ---------- */
        .right-rail {
            width: 280px;
            flex-shrink: 0;
            background: #0f1f30;
            border: 1px solid rgba(212, 175, 106, .15);
            border-radius: 18px;
            padding: 20px 18px 30px;
            height: calc(100vh - 48px);
            position: sticky;
            top: 20px;
            overflow-y: auto;
            transition: transform .35s cubic-bezier(.22, .68, 0, 1), opacity .30s ease, margin .35s ease;
            transform: translateX(0);
            opacity: 1;
            margin-right: 0;
        }
        .right-rail.hidden {
            transform: translateX(32px);
            opacity: 0;
            pointer-events: none;
            margin-right: -280px;
            width: 280px;
        }

        .rr-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .09em;
            color: #6d859f;
            text-transform: uppercase;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rr-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, #24435f, transparent);
        }
        .rr-label:first-child {
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #c9a24d, #b88a45);
            color: #2a1608;
            border: 1px solid rgba(230, 201, 119, .5);
            padding: 13px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(201, 162, 77, .18);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(212, 175, 106, .30);
        }
        .btn-primary svg {
            width: 16px;
            height: 16px;
        }

        .btn-outline {
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            color: #a8bccf;
            border: 1px solid #24435f;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all .15s ease;
        }
        .btn-outline:hover {
            border-color: #c9a24d;
            color: #eef1e9;
            background: #142a3e;
        }

        .qa-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 4px;
            font-size: 13.5px;
            color: #a8bccf;
            font-weight: 500;
            border-radius: 9px;
            transition: color .15s ease, background .15s ease;
        }
        .qa-item:hover {
            color: #e6c977;
            background: #142a3e;
            padding-left: 10px;
        }
        .qa-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #6d859f;
        }

        .genre-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
            font-size: 13.5px;
            font-weight: 500;
            color: #a8bccf;
            border-radius: 9px;
            transition: background .15s ease, color .15s ease;
        }
        .genre-item:hover {
            background: #142a3e;
            color: #eef1e9;
            padding-left: 10px;
        }
        .genre-item.active {
            color: #e6c977;
        }
        .genre-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .g-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .genre-item .n {
            color: #6d859f;
            font-size: 12.5px;
        }

        .story-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 4px;
            border-radius: 10px;
            transition: background .15s ease;
        }
        .story-item:hover {
            background: #142a3e;
        }
        .story-thumb {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            flex-shrink: 0;
            border: 1px solid rgba(212, 175, 106, .30);
            background-size: cover;
            background-position: center;
        }
        .story-item .t {
            font-size: 13.5px;
            font-weight: 600;
            color: #eef1e9;
            line-height: 1.25;
        }
        .story-item .ts {
            font-size: 11.5px;
            color: #6d859f;
            margin-top: 2px;
        }

        .view-all {
            font-size: 13px;
            font-weight: 600;
            color: #c9a24d;
            margin-top: 10px;
            display: inline-block;
        }

        /* ---------- FLOATING CONTROLS ---------- */
        .float-controls {
            position: fixed;
            bottom: 32px;
            right: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 40;
        }

        .float-new-story {
            background: linear-gradient(135deg, #c9a24d, #b88a45);
            color: #2a1608;
            border: 1px solid rgba(230, 201, 119, .5);
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(201, 162, 77, .25);
            transition: transform .20s ease, opacity .25s ease, box-shadow .20s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .float-new-story:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(201, 162, 77, .35);
        }
        .float-new-story.hidden {
            opacity: 0;
            transform: scale(.92) translateY(8px);
            pointer-events: none;
        }
        .float-new-story svg {
            width: 16px;
            height: 16px;
        }

        .toggle-rail-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #142a3e;
            border: 1px solid rgba(212, 175, 106, .35);
            color: #c9a24d;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
            transition: transform .20s ease, background .15s ease, border-color .15s ease;
            flex-shrink: 0;
        }
        .toggle-rail-btn:hover {
            background: #1c3a52;
            border-color: #c9a24d;
            transform: scale(1.04);
        }
        .toggle-rail-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ---------- NOTIFICATION POPOVER ---------- */
        .notif-pop {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            max-height: 400px;
            overflow-y: auto;
            background: #0f1f30;
            border: 1px solid rgba(212, 175, 106, .25);
            border-radius: 14px;
            box-shadow: 0 20px 56px rgba(0, 0, 0, .6);
            z-index: 70;
            display: none;
        }
        .notif-pop.open {
            display: block;
        }
        .notif-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #1a3049;
            font-size: 13.5px;

        /* ==============================================================

        const container = document.getElementById('sidebar-container');

        function injectSidebar(html) {
            container.innerHTML = html;
            bindSidebarEvents();
            renderNotifications();
            // set logo image
            if (window.__sidebarLogo) {
                window.__sidebarLogo.setImage('images/sidebar-logo.png');
            }
        }

        function bindSidebarEvents() {
            const bell = document.getElementById('sidebarBell');
            const notifPop = document.getElementById('notifPop');
            if (bell) {
                bell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    notifPop.classList.toggle('open');
                    if (notifPop.classList.contains('open')) {
                        notifications.forEach(n => n.read = true);
                        renderNotifications();
                        const dot = document.getElementById('sidebarBellDot');
                        if (dot) dot.style.display = 'none';
                        bell.classList.remove('has-unread');
                    }
                });
            }

            const helpBtn = document.getElementById('sidebarHelp');
            if (helpBtn) {
                helpBtn.addEventListener('click', () => {
                    alert('Plotter Help — contact support@plotter.com');
                });
            }

            const sidebarCreate = document.getElementById('sidebarCreateBtn');
            if (sidebarCreate) {
                // Build the dropdown menu if the injected sidebar.html doesn't already have one
                let createMenu = document.getElementById('createMenu');
                if (!createMenu) {
                    createMenu = document.createElement('div');
                    createMenu.className = 'create-menu';
                    createMenu.id = 'createMenu';
                    createMenu.setAttribute('role', 'menu');
                    createMenu.setAttribute('aria-label', 'Create options');
                    createMenu.innerHTML = `
                        <button class="create-menu-item" id="menuUpload" role="menuitem" type="button">Upload</button>
                        <button class="create-menu-item" id="menuBlankProject" role="menuitem" type="button">Create blank project</button>
                    `;
                    sidebarCreate.insertAdjacentElement('afterend', createMenu);
                }

                sidebarCreate.setAttribute('aria-haspopup', 'true');
                sidebarCreate.setAttribute('aria-expanded', 'false');

                sidebarCreate.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = createMenu.classList.toggle('open');
                    sidebarCreate.setAttribute('aria-expanded', String(isOpen));
                });

                document.addEventListener('click', (e) => {
                    if (!createMenu.contains(e.target) && e.target !== sidebarCreate) {
                        createMenu.classList.remove('open');
                        sidebarCreate.setAttribute('aria-expanded', 'false');
                    }
                });

                const menuUpload = document.getElementById('menuUpload');
                if (menuUpload) {
                    menuUpload.addEventListener('click', () => {
                        createMenu.classList.remove('open');
                        sidebarCreate.setAttribute('aria-expanded', 'false');

        /* ---------------- Cover art ----------------
   Cover images live in the /images folder (same directory as this page,
   inside your "PlotterMockUp-1" folder). For each template, the loader
   tries the slugified title with several extensions in turn (jpg, jpeg,
   png, webp, gif) and uses whichever file actually exists. If a template's
   file name doesn't match the default slug, add an entry to
   IMAGE_NAME_OVERRIDES with just the base filename (no extension).
   Default pattern tried: images/<slug>.<ext>
*/
        const IMAGE_DIR = 'images';
        const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg']; // tried in this order

         const IMAGE_NAME_OVERRIDES = {
            "Journey Through the Solar System": "journeytothesolarsystem",
            "The DNA Detectives": "dna",
            "Ecosystem Explorer": "explores",
            "Ancient Egypt: The Pharaoh's Court": "egypt",
            "The Underground Railroad": "rail",
            "The Fraction Kingdom": "fraction",
            "Pythagoras and the Lost Temple": "pyt"
        };

        function slugify(title){
        return title.toLowerCase().replace(/[^a-z0-9]+/g, '');
        }

        function baseImageName(title){
        return IMAGE_NAME_OVERRIDES[title] || slugify(title);
        }

        /* Tries each extension in turn for a given title; calls onFound(url) the
        first time an image actually loads. If none load, onFound is never called
        and the element just keeps its gradient background. */
        function findCoverImage(title, onFound){
        const base = baseImageName(title);
        let i = 0;

        function tryNext(){
            if(i >= IMAGE_EXTENSIONS.length) return; // no matching file found — keep gradient
            const ext = IMAGE_EXTENSIONS[i++];
            const url = `${IMAGE_DIR}/${base}.${ext}`;
            const img = new Image();
            img.onload = () => onFound(url);
            img.onerror = tryNext;
            img.src = url;
        }
        tryNext();
        }

        data-img-title and layers its real cover photo over the gradient
        once (if ever) it's found. */
        function hydrateImages(){
        document.querySelectorAll('[data-img-title]').forEach(el => {
            const title = el.dataset.imgTitle;
            findCoverImage(title, (url) => {
            const grad = el.dataset.grad || '';
            el.style.background = `url('${url}') center/cover no-repeat${grad ? ', ' + grad : ''}`;
            });
        });
        }

            { title: "Algebra Adventures", ts: "3 days ago", grad: GRADIENTS[8] },
        ];

        let notifications = [
            { id: 'n1', text: 'Elena Cruz accepted your invite to "Ancient Rome: Rise & Fall."', when: 'Yesterday',
                read: false },
        ];

        function catMeta(key) { return CATS.find(c => c.key === key); }

        function gradFor(idx, multiplier) {
            return GRADIENTS[(idx * (multiplier || 1)) % GRADIENTS.length];
        }

        function tplCard(t, idx) {
            const meta = catMeta(t.cat);
            const grad = gradFor(idx, 3);
            return `
            <div class="tpl-card" data-cat="${t.cat}" data-title="${t.title.toLowerCase()}" data-author="${t.author.toLowerCase()}">
              <div class="tpl-thumb" style="background:${grad}" data-img-title="${t.title}" data-grad="${grad}">
                <span class="badge" style="background:${meta.color}25; color:${meta.color}; border:1px solid ${meta.color}55">${meta.label}</span>
                <span class="scene-count">${t.scenes} scenes</span>
                <div class="tpl-actions">
                  <button class="btn-use">Use template</button>
                  <button class="btn-preview">Preview</button>
                </div>
              </div>
              <div class="tpl-body">
                <div class="card-title">${t.title}</div>
                <div class="card-desc">${t.desc}</div>
                <div class="tpl-author">
                  <span class="author-dot" style="background:${colorFor(t.author)}">${initials(t.author)}</span>
                  <span>${t.author}</span>
                </div>
              </div>
            </div>`;
        }

        function renderFilters() {
            const container = document.getElementById('filters');
            container.innerHTML = CATS.map(c => `
            <button class="pill ${c.key === 'all' ? 'active' : ''}" data-cat="${c.key}">
              ${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}
              ${c.label}
            </button>`).join('');

            container.querySelectorAll('.pill').forEach(p => {
                p.addEventListener('click', () => {
                    container.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
                    p.classList.add('active');
                    filterGrid(p.dataset.cat, document.getElementById('searchInput').value);
                });
            });
        }

        function renderGrid(list) {
            const grid = document.getElementById('grid');
            if (!list.length) {
                grid.innerHTML =
                    `<div class="empty-state">No templates match your search. Try a different keyword or genre.</div>`;
            } else {
                grid.innerHTML = list.map((t, i) => tplCard(t, i)).join('');
            }
            document.getElementById('gridCount').textContent = `${list.length} template${list.length === 1 ? '' : 's'}`;
            hydrateImages();
        }

        function filterGrid(cat, query) {
            const q = (query || '').trim().toLowerCase();
            const filtered = templates.filter(t => {
                const matchesCat = cat === 'all' || t.cat === cat;
                const matchesQuery = !q || t.title.toLowerCase().includes(q) || t.author.toLowerCase().includes(q);
                return matchesCat && matchesQuery;
            });
            renderGrid(filtered);
        }

        function renderGenres() {
            const counts = {};
            templates.forEach(t => counts[t.cat] = (counts[t.cat] || 0) + 1);
            const list = CATS.filter(c => c.key !== 'all');
            const container = document.getElementById('genreList');
            container.innerHTML = list.map(c => `
            <div class="genre-item" data-cat="${c.key}">
              <span class="genre-left"><span class="g-dot" style="background:${c.color}"></span>${c.label}</span>
              <span class="n">${counts[c.key] || 0}</span>
            </div>`).join('');

            container.querySelectorAll('.genre-item').forEach(g => {
                g.addEventListener('click', () => {
                    const cat = g.dataset.cat;
                    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset
                        .cat === cat));
                    filterGrid(cat, document.getElementById('searchInput').value);
                    document.querySelector('.main-wrap').scrollIntoView({ behavior: 'smooth' });
                });
            });
        }

        function renderStories() {
            const container = document.getElementById('storyList');
            container.innerHTML = stories.map(s => `
            <div class="story-item">
              <div class="story-thumb" style="background:${s.grad}"></div>
              <div>
                <div class="t">${s.title}</div>
                <div class="ts">${s.ts}</div>
              </div>
            </div>`).join('');
        }

        function renderNotifications() {
            const hasUnread = notifications.some(n => !n.read);
            const dot = document.getElementById('sidebarBellDot');
            const bell = document.getElementById('sidebarBell');
            if (dot) dot.style.display = hasUnread ? 'block' : 'none';
            if (bell) bell.classList.toggle('has-unread', hasUnread);

            const list = document.getElementById('notifList');
            if (!list) return;
            list.innerHTML = notifications.length ?
                notifications.map(n => `
              <div class="notif-item ${n.read ? '' : 'unread'}">
                <div class="ic">🔔</div>
                <div>
                  <div class="txt">${n.text}</div>
                  <div class="when">${n.when}</div>
                </div>
              </div>`).join('') :
                `<div class="notif-empty">You're all caught up — no notifications yet.</div>`;
        }

        /* ----- init main ----- */
        renderFilters();
        renderGrid(templates);
        renderGenres();
        renderStories();
        renderNotifications();

        /* ----- search ----- */
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeCat = document.querySelector('.pill.active')?.dataset.cat || 'all';
            filterGrid(activeCat, e.target.value);
        });

        /* ----- right rail toggle ----- */
        const rail = document.getElementById('rightRail');
        const toggleBtn = document.getElementById('toggleRailBtn');
        const floatNew = document.getElementById('floatNewStory');
        let railOpen = false;

        function updateRail() {
            rail.classList.toggle('hidden', !railOpen);
            floatNew.classList.toggle('hidden', railOpen);
            const svg = toggleBtn.querySelector('svg');
            if (svg) {
                svg.innerHTML = railOpen ?
                    `<path d="M15 18l-6-6 6-6"/>` :
                    `<path d="M9 18l6-6-6-6"/>`;
            }
        }

        toggleBtn.addEventListener('click', () => {
            railOpen = !railOpen;
            updateRail();
        });

        railOpen = false;
        updateRail();

        document.addEventListener('click', (e) => {
            if (railOpen && !rail.contains(e.target) && !toggleBtn.contains(e.target) && !floatNew.contains(e.target)) {
                railOpen = false;
                updateRail();
            }
        });

        /* ----- "New story" handler ----- */
        function handleNewStory() {
            alert('✨ Create a new story!');
        }

        document.getElementById('floatNewStory').addEventListener('click', handleNewStory);
        document.getElementById('railNewStory').addEventListener('click', handleNewStory);

        /* ----- notification clear ----- */
        const clearBtn = document.getElementById('notifClear');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                notifications.forEach(n => n.read = true);
                renderNotifications();
                const dot = document.getElementById('sidebarBellDot');
                if (dot) dot.style.display = 'none';
                const bell = document.getElementById('sidebarBell');
                if (bell) bell.classList.remove('has-unread');
            });
        }

        document.addEventListener('click', (e) => {
            const pop = document.getElementById('notifPop');
            const bell = document.getElementById('sidebarBell');
            if (pop && !pop.contains(e.target) && e.target !== bell && !bell?.contains(e.target)) {
                pop.classList.remove('open');
            }
        });

        /* ----- replaceable brand image (with error logging) ----- */
        window.__webName = {
            setImage: (src) => {
                const img = document.getElementById('webNameImg');
                const placeholder = document.getElementById('webNamePlaceholder');
                if (img && placeholder) {
                    if (src) {
                        img.src = src;
                        img.onload = () => {
                            img.style.display = 'block';
                            placeholder.style.display = 'none';
                            console.log('✅ Brand image loaded:', src);
                        };
                        img.onerror = () => {
                            img.style.display = 'none';
                            placeholder.style.display = 'block';
                        };
                        if (img.complete) {
                            img.onload();
                        }
                    } else {
                        img.style.display = 'none';
                        placeholder.style.display = 'block';
                    }
                }
            }
        };

        window.__webName.setImage('images/brand-name.png');

    </script>

</body>
</html>
