<script>
// --- Added: create button dropdown behavior only ---
(function () {
    const createBtn = document.getElementById('sidebarCreateBtn');
    const createMenu = document.getElementById('createMenu');
    const menuUpload = document.getElementById('menuUpload');
    const menuBlankProject = document.getElementById('menuBlankProject');
    const hiddenFileInput = document.getElementById('hiddenFileInput');

    function openMenu() {
        createMenu.classList.add('open');
        createBtn.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onOutsideClick);
    }

    function closeMenu() {
        createMenu.classList.remove('open');
        createBtn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', onOutsideClick);
    }

    function onOutsideClick(e) {
        if (!createMenu.contains(e.target) && e.target !== createBtn) {
            closeMenu();
        }
    }

    createBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        createMenu.classList.contains('open') ? closeMenu() : openMenu();
    });

    menuUpload.addEventListener('click', function () {
        closeMenu();
        hiddenFileInput.click();
        // TODO: hook hiddenFileInput's change event into your upload logic
    });

    menuBlankProject.addEventListener('click', function () {
        closeMenu();
        // TODO: replace with your blank-project creation logic
    });
})();
</script>
